# Builds and tests the Windows .exe on every push; download it from the run's "Artifacts".
name: build-windows-exe
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -r requirements-dev.txt pyinstaller==6.11.1
      - name: Test
        run: python -m pytest -q
      - name: Build exe
        run: pyinstaller --noconfirm --clean --onefile --windowed --name SpaceFractionsAgent --add-data "inputs;inputs" --hidden-import agent._bundle sf_agent_app.py
      - name: Smoke-test the exe's test-runner mode
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke/tests | Out-Null
          Set-Content smoke/calc.py "def add(a, b):`n    return a + b"
          Set-Content smoke/tests/__init__.py ""
          Set-Content smoke/tests/test_calc.py "import unittest, fractions, sqlite3`nfrom calc import add`nclass T(unittest.TestCase):`n    def test_add(self):`n        self.assertEqual(add(1, 2), 3)"
          $p = Start-Process dist/SpaceFractionsAgent.exe -ArgumentList "--run-tests","$PWD/smoke","tests","test*.py","$PWD/smoke.json" -Wait -PassThru
          Get-Content smoke.json
          if ((Get-Content smoke.json | ConvertFrom-Json).ok -ne $true) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: SpaceFractionsAgent-windows
          path: dist/SpaceFractionsAgent.exe
